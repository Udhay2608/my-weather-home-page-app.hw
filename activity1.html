<html>
    <head>
        <title>My colour card</title>
        <style>
            /* Universal Selector - applies to everything on the page*/
            *{
                font-size: 16px;
            }

            /*Element Selectors*/
            body {
                background-color: lightgray;
            }
            h1 {
                color: darkblue;
            } 
            
            h2 {
                color: purple;
            }

            p {
                color: dimgray;
            }
            /* Class Selector*/
            .my-detail {
                color: darkgreen;
                font-weight: bold;
            }

            /* ID Selector*/
            #my-card{
                background-color: lightcyan;
            }

        </style>
    </head>
    <body>
        <h1>My colour card</h1>
        <p style="color: crimson,">Hi! This is my very one webpage</p>
        <div id="my-card">
            <h2>About me</h2>
            <p class="my detail">My name is sam</p>
            <p class="my detail">My favourite colour is red</p>
            <p class="my detail">My foavourite subject is maths</p>
            <p class="my detail">My favourite food is pizza</p>
        </div>
        <h2>My favourite things</h2>
        <p>My favourite animal is a dog</p>
        <p>My favourite sport is football</p>
        <p>My favourite movie is mission impossible</p>
    </body>
</html>
